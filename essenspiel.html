<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morstar Frau - Essensfänger</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            background-color: #87CEEB; /* Himmelblau */
            border: 4px solid #34495e;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
        }
        p {
            font-size: 16px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <h1>Morstar Frau</h1>
    <p>Steuerung: Pfeiltasten Links/Rechts ⬅️ ➡️ | Sammle leckeres Essen, meide giftige Pilze! 🍄</p>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Spielvariablen
        let score = 0;
        let lives = 3;
        let gameOver = false;

        // Spieler: Morstar Frau
        const player = {
            x: 180,
            y: 520,
            width: 50,
            height: 50,
            speed: 6,
            dx: 0,
            emoji: '👩'
        };

        // Essens-Objekte
        const items = [];
        const goodFoods = ['🍎', '🍌', '🍕', '🍔', '🌮', '🍩'];
        const badFoods = ['🍄', '🤢']; // Giftige Pilze / Schlechtes Essen

        // Tastatursteuerung
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") player.dx = -player.speed;
            if (e.key === "ArrowRight") player.dx = player.speed;
            if (e.key === "Enter" && gameOver) resetGame();
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") player.dx = 0;
        });

        // Funktion: Essen spawnen
        function spawnItem() {
            if (Math.random() < 0.03) { // Spawn-Wahrscheinlichkeit
                const isBad = Math.random() < 0.25; // 25% Chance auf giftiges Essen
                const typeList = isBad ? badFoods : goodFoods;
                const type = typeList[Math.floor(Math.random() * typeList.length)];
                
                items.push({
                    x: Math.random() * (canvas.width - 40),
                    y: -40,
                    size: 40,
                    speed: Math.random() * 2 + 2,
                    emoji: type,
                    isBad: isBad
                });
            }
        }

        // Spieler bewegen
        function movePlayer() {
            player.x += player.dx;
            
            // Kollision mit den Wänden verhindern
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }

        // Zeichnen und Logik updaten
        function update() {
            if (gameOver) {
                drawGameOver();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Benutzeroberfläche zeichnen
            ctx.fillStyle = "black";
            ctx.font = "20px Arial";
            ctx.fillText(`Punkte: ${score}`, 15, 30);
            ctx.fillText(`Leben: ${'❤️'.repeat(lives)}`, canvas.width - 120, 30);

            // Spieler zeichnen
            movePlayer();
            ctx.font = "50px Arial";
            ctx.fillText(player.emoji, player.x, player.y + 40);

            // Essen spawnen und bewegen
            spawnItem();
            
            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                item.y += item.speed;

                ctx.font = "40px Arial";
                ctx.fillText(item.emoji, item.x, item.y + 30);

                // Kollisionserkennung
                if (
                    item.x < player.x + player.width - 10 &&
                    item.x + item.size - 10 > player.x &&
                    item.y < player.y + player.height &&
                    item.y + item.size > player.y
                ) {
                    if (item.isBad) {
                        lives--;
                        if (lives <= 0) gameOver = true;
                    } else {
                        score += 10;
                    }
                    items.splice(i, 1);
                    i--;
                    continue;
                }

                // Entfernen, wenn aus dem Bildschirm gefallen
                if (item.y > canvas.height) {
                    items.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(update);
        }

        // Game Over Bildschirm
        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "white";
            ctx.font = "40px Arial";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "20px Arial";
            ctx.fillText(`Dein Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText("Drücke ENTER für Neustart", canvas.width / 2, canvas.height / 2 + 60);
            ctx.textAlign = "left"; // Reset für das restliche Spiel
        }

        // Spiel zurücksetzen
        function resetGame() {
            score = 0;
            lives = 3;
            items.length = 0; // Array leeren
            player.x = 180;
            gameOver = false;
            update();
        }

        // Spiel starten
        update();

    </script>
</body>
</html>
